[package]
name = "rusting_strata"
version = "1.2.0"
edition = "2024"
license-file = "LICENSE.md"

[[bin]]
name = "strata"
path = "src/main.rs"

[dependencies]
anyhow = "1"
memmap2 = "0.9"
rayon = "1"
half = "2"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading"] }
ash = "0.38"
ureq = { version = "3", default-features = false, features = ["rustls"] }

# NVRTC 版本与目标架构的编译开关（互斥，只能开一个）：
#   默认 / --features nvrtc_13  CUDA 13 NVRTC，仅 Ampere 及以上（sm_80+，cp.async 与 int8 tensor core）。
#   --no-default-features --features nvrtc_12  CUDA 12 NVRTC，额外支持 Volta/Turing 老型号（Tesla V100 的 sm_70）。
[features]
default = ["nvrtc_13"]
nvrtc_13 = ["cudarc/cuda-13010"]
nvrtc_12 = ["cudarc/cuda-12060"]

[profile.release]
opt-level = 3
debug = 1
codegen-units = 1
lto = "thin"

[profile.test]
opt-level = 3
